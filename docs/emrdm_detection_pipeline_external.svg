<text x="90" y="875" font-size="22" font-family="Arial, Segoe UI, sans-serif" fill="#5f6b7a" font-weight="500">Recommended usage in the paper: keep this panel separate from the core EMRDM framework and describe the detector as an external downstream benchmark.</text>
