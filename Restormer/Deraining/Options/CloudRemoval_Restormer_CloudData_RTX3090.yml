# general settings
name: CloudRemoval_Restormer_CloudData_RTX3090
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 3407

# dataset and data loader settings
datasets:
  train:
    name: CloudDataTrain
    type: Dataset_PairedImage
    dataroot_gt: 'D:/EMRDM-main/Restormer/Datasets/cloud_data/train/label'
    dataroot_lq: 'D:/EMRDM-main/Restormer/Datasets/cloud_data/train/cloudy'
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    pin_memory: true

    # Progressive training tuned for a single RTX 3090 24GB.
    mini_batch_sizes: [4,4,3,2,2,1]
    iters: [40000,40000,40000,30000,30000,20000]
    gt_size: 384
    gt_sizes: [128,160,192,256,320,384]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: CloudDataVal
    type: Dataset_PairedImage
    dataroot_gt: 'D:/EMRDM-main/Restormer/Datasets/cloud_data/val/label'
    dataroot_lq: 'D:/EMRDM-main/Restormer/Datasets/cloud_data/val/cloudy'
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 200000
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [40000, 160000]
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 2e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 4

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
